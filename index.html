<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARDOGS Gold Price Checker</title>
</head>

<body>

    <h1>WARDOGS Gold Price</h1>

    <p>Check the current gold price and calculate your gold value.</p>

    <div>
        <h2>Gold Price</h2>
        <p id="gold-price">Loading...</p>
    </div>

    <div>
        <h2>Gold Calculator</h2>

        <label for="gold-amount">Gold amount (grams):</label>
        <input type="number" id="gold-amount" placeholder="10">

        <button>Calculate</button>

        <p id="gold-value">£0.00</p>
    </div>

</body>
</html>
